<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBR — Falar com a equipe</title>
  <link rel="icon" type="image/png" href="/logos/icon.png" />
  <meta name="theme-color" content="#1C2632" />
  <style>
    @font-face {
      font-family: "Helvetica Now Display";
      src: url("/fonts/HelveticaNowDisplay-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Helvetica Now Display";
      src: url("/fonts/HelveticaNowDisplay-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "Instrument Serif";
      src: url("/fonts/InstrumentSerif-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy-deep: #1C2632;
      --navy:      #2C3B4D;
      --amber:     #FEB161;
      --creme:     #EDE9DE;
      --bege:      #C9C2B2;
    }

    html, body {
      height: 100%;
      background: var(--navy-deep);
      font-family: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .logo {
      height: 48px;
      margin-bottom: 48px;
      opacity: .9;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 20px;
    }

    .title {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 400;
      color: var(--creme);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 14px;
      font-weight: 400;
      color: var(--bege);
      line-height: 1.6;
      margin-bottom: 44px;
    }

    /* countdown ring */
    .ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 40px;
    }
    .ring-wrap svg {
      transform: rotate(-90deg);
    }
    .ring-bg {
      fill: none;
      stroke: rgba(255,255,255,.08);
      stroke-width: 3;
    }
    .ring-fill {
      fill: none;
      stroke: var(--amber);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 201;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .ring-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 26px;
      color: var(--creme);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 24px;
      border-radius: 10px;
      background: var(--amber);
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--navy-deep);
      letter-spacing: 0.2px;
      transition: opacity .2s, transform .15s;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); opacity: 1; }

    .btn svg { flex-shrink: 0; }

    .skip {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(201, 194, 178, 0.35);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="/logos/icon.png" class="logo" alt="IBR" />

    <p class="label">Instituto Brasileiro de Refrativa</p>

    <h1 class="title">Vamos conversar?</h1>
    <p class="sub">Você será redirecionado para o WhatsApp em instantes.</p>

    <div class="ring-wrap">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle class="ring-bg" cx="36" cy="36" r="32" />
        <circle class="ring-fill" id="ring" cx="36" cy="36" r="32" />
      </svg>
      <div class="ring-num" id="num">3</div>
    </div>

    <a class="btn" href="https://wa.me/551150284894" id="wpp-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Falar agora no WhatsApp
    </a>

    <p class="skip">ou aguarde o redirecionamento automático</p>
  </div>

  <script>
    const WPP = "https://wa.me/551150284894";
    const TOTAL = 3;
    const circumference = 2 * Math.PI * 32; // ~201

    const ring = document.getElementById("ring");
    const num  = document.getElementById("num");

    ring.style.strokeDasharray  = circumference;
    ring.style.strokeDashoffset = 0;

    let count = TOTAL;

    // força reflow antes de iniciar animação
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        tick();
      });
    });

    function tick() {
      count--;
      ring.style.strokeDashoffset = circumference * (1 - count / TOTAL);
      num.textContent = count;

      if (count <= 0) {
        setTimeout(() => { window.location.href = WPP; }, 1050);
      } else {
        setTimeout(tick, 1000);
      }
    }
  </script>
</body>
</html>
